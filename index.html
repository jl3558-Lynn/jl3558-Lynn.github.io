<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinglin's Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fcfcfd;
            color: #1a1a1a;
            line-height: 1.5;
        }

        /* Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 4rem;
            background-color: #ffffff;
            border-bottom: 1px solid #f0f0f0;
        }

        .logo {
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .logo span {
            color: #cc0000;
            font-weight: 800;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 1.8rem;
        }

        nav a {
            text-decoration: none;
            color: #4a4a4a;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .btn-download {
            background-color: #1a1e29;
            color: #ffffff !important;
            padding: 0.5rem 1.1rem;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        /* Main Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3.5rem 1.5rem;
        }

        .hero {
            display: flex;
            gap: 3.5rem;
            align-items: flex-start;
            margin-bottom: 4rem;
        }

        /* Profile Card */
        .profile-card {
            width: 220px;
            flex-shrink: 0;
            text-align: center;
        }

        .avatar-wrapper {
            width: 150px;
            height: 150px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #000;
        }

        .profile-card .school {
            font-size: 0.8rem;
            color: #d93838;
            font-weight: 600;
            margin-top: 0.2rem;
        }

        .profile-card .class-year {
            font-size: 0.75rem;
            color: #888888;
            margin-top: 0.1rem;
        }

        /* Right Content Area */
        .hero-content {
            flex-grow: 1;
        }

        .badge {
            display: inline-block;
            background-color: #fde8e8;
            color: #e53e3e;
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-weight: 600;
            margin-bottom: 1.2rem;
        }

        .hero-content h1 {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -0.02em;
            color: #0f172a;
            margin-bottom: 1.2rem;
        }

        .hero-content .description {
            font-size: 0.95rem;
            color: #555555;
            line-height: 1.6;
            margin-bottom: 1.8rem;
            max-width: 620px;
        }

        /* CTA Buttons */
        .cta-buttons {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .btn-email {
            background-color: #f3f4f6;
            color: #1f2937;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .link-linkedin {
            color: #4b5563;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Section Title */
        .section-title h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0.4rem;
        }

        .section-title p {
            color: #666666;
            font-size: 0.88rem;
            max-width: 650px;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="logo">
            <span>RBS</span> Jinglin's Portfolio
        </div>
    </header>

    <!-- Main Container -->
    <main class="container">
        <section class="hero">
            <!-- Left Profile Card -->
            <div class="profile-card">
                <div class="avatar-wrapper">
                    <img src="Jinglin.jpg" alt="Jinglin">
                </div>
                <h3>Jinglin Liu </h3>
                <p class="school">Rutgers Business School</p>
            </div>

            <!-- Right Hero Content -->
            <div class="hero-content">
                <h1>Description</h1>
                <p class="Personal statement">
                   My name is Jinglin Liu. I am a student majoring in accounting at RBS, with a strong interest in learning accounting concepts and expertise,while being hardworking,dedicated and trustworthy.
                <div class="cta-buttons">
                    <a href="https://linkedin.com" target="_blank" class="link-linkedin">LinkedIn Profile &rarr;</a>
                </div>
     <!-- Skills -->
            <section>
                <h1>Skills<h1>
                    
            
            </div>
        </section>

        

</body>
</html>
